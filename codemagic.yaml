workflows:
  my-translate-apk:
    name: My Translate APK
    instance_type: mac_mini_m1
    environment:
      # Phase A: Dart 3 / Flutter 3.22+（移除 vosk_flutter 后解锁）
      flutter: stable
    triggering:
      events:
        - push
    scripts:
      - name: Generate platform scaffolding
        # android/ 文本文件已入库，仅需生成 gradle-wrapper.jar 等二进制
        script: flutter create --platforms=android --project-name my_translate .
      - name: Restore committed custom files
        # flutter create 可能覆盖自定义文件，从 git 恢复
        script: |
          git checkout -- android/app/build.gradle \
            android/app/src/main/AndroidManifest.xml \
            android/app/src/main/kotlin/ \
            android/settings.gradle \
            android/build.gradle \
            android/gradle.properties \
            android/gradle/wrapper/gradle-wrapper.properties \
            android/app/proguard-rules.pro
      - name: Fetch models (GitHub official source)
        # Codemagic 海外机直连 GitHub；AAR 已入库脚本自动跳过。
        # 原 ModelScope 版 fetch_models.sh 直链 404 已弃用（2026-07-31）。
        script: bash tools/fetch_models_github.sh
      - name: Get dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
