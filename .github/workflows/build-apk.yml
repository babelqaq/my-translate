name: Build Debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter (latest stable, Dart 3)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Doctor
        run: flutter doctor -v || true

      - name: Generate platform scaffolding (gradle-wrapper.jar etc.)
        # android/ 文本文件已入库，但 gradle-wrapper.jar 是二进制需生成。
        # flutter create 不会覆盖已存在的自定义文件（asr/*.kt 等）。
        run: flutter create --platforms=android --project-name my_translate .

      - name: Pin Gradle to 9.1.0 (AGP minimum)
        # 当前 Flutter stable 实际应用的 AGP 要求 Gradle >= 9.1.0；
        # flutter create 可能生成较低版本（如 8.12），这里强制对齐，
        # 否则会在插件解析阶段报 "Minimum supported Gradle version is 9.1.0"。
        # gradle-wrapper.jar 与 Gradle 9.1.0 兼容，可正常引导下载。
        run: |
          sed -i 's#gradle-[0-9][0-9.]*-bin\.zip#gradle-9.1.0-bin.zip#' android/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Restore committed custom files
        # flutter create 可能覆盖我们的 build.gradle / Manifest / Kotlin，
        # 从 git 恢复我们的版本（不影响 flutter create 生成的 res/ 和 gradle-wrapper.jar）。
        run: |
          git checkout -- android/app/build.gradle \
            android/app/src/main/AndroidManifest.xml \
            android/app/src/main/kotlin/ \
            android/settings.gradle \
            android/build.gradle \
            android/gradle.properties \
            android/app/proguard-rules.pro
          # 注意：android/gradle/wrapper/gradle-wrapper.properties 故意不恢复，
          # 由上面 `flutter create` 生成与当前 Flutter 匹配的 Gradle 版本（AGP 9 需 Gradle >= 8.11.1）。

      - name: Cache models
        # 模型共 ~330MB，缓存后二次构建免下载。key 绑定下载脚本内容，
        # 脚本改了（换模型/换版本）自动失效重新下载。
        uses: actions/cache@v4
        with:
          path: android/app/src/main/assets/models
          key: sherpa-models-${{ hashFiles('tools/fetch_models_github.sh') }}

      - name: Fetch models (GitHub official source)
        # CI runner 在海外，直连 GitHub 官方 Releases（本脚本已在本地实测跑通，
        # 已存在的文件自动跳过；AAR 已入库，脚本同样会跳过）。
        # tools/fetch_models.sh 的 ModelScope 路径未经验证会 404，CI 不再使用。
        run: bash tools/fetch_models_github.sh

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --debug --verbose 2>&1 | tee build_log.txt

      - name: Surface build failure detail
        if: failure()
        run: |
          echo "===== FAILURE / What went wrong / Caused by in build_log.txt ====="
          grep -n -A 60 -E "FAILURE: Build failed|What went wrong|Caused by|e: file://|error: " build_log.txt 2>/dev/null || echo "(no match in build_log.txt)"
          echo "===== tail of build_log.txt ====="
          tail -n 90 build_log.txt 2>/dev/null || true
          echo "===== gradle daemon logs ====="
          find ~/.gradle/daemon -name "daemon-*.out.log" 2>/dev/null -exec echo "--- {} ---" \; -exec tail -n 120 {} \; || true

      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            android/build/outputs/logs/
            **/flutter_build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-translate-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
