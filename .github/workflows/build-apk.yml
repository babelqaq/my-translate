name: Build Debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        # Flutter 3.7.x 自带 Gradle 7.5 + AGP 7.3，需 Java 11~17；runner 默认 Java 21 不兼容，显式锁定 17。
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.7.12 (Dart 2.19)
        # vosk_flutter 0.3.48 仅支持 Dart <3.0，因此必须用 Flutter 3.7.x（最后一个 Dart 2.19）。
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.7.12'
          channel: 'stable'

      - name: Setup Android SDK
        # GitHub runner 默认不带 Android SDK，这里安装并自动接受许可。
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-33 build-tools;33.0.2'

      - name: Doctor (diagnostics)
        run: flutter doctor -v || true

      - name: Generate platform files (android/)
        # 显式指定 project-name，避免 flutter create 用 checkout 目录名（my-translate，含连字符）作包名导致非法。
        run: flutter create --platforms=android --project-name my_translate .

      - name: Patch Android permissions & minSdk
        run: |
          sed -i 's#</manifest>#  <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n  <uses-permission android:name="android.permission.INTERNET"/>\n  <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n  <queries>\n    <intent>\n      <action android:name="android.speech.RecognitionService" />\n    </intent>\n  </queries>\n</manifest>#' android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug --verbose

      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            android/build/outputs/logs/
            **/flutter_build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-translate-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Publish APK to Release (for faster mirror download)
        if: success()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete debug-apk -y || true
          gh release create debug-apk build/app/outputs/flutter-apk/app-debug.apk \
            --title "Debug APK (latest)" \
            --notes "Auto-built debug APK. 国内镜像(任选其一，把前缀加到原 GitHub 链接前):\n- https://ghproxy.net/https://github.com/${{ github.repository }}/releases/download/debug-apk/app-debug.apk\n- https://mirror.ghproxy.com/https://github.com/${{ github.repository }}/releases/download/debug-apk/app-debug.apk\n- https://ghproxy.cfd/https://github.com/${{ github.repository }}/releases/download/debug-apk/app-debug.apk" \
            --prerelease

      - name: Publish Vosk models to Release (in-app mirror via ghproxy)
        if: success()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in vosk-model-small-en-us-0.15.zip vosk-model-small-cn-0.22.zip vosk-model-small-ru-0.22.zip; do
            curl -fSL "https://alphacephei.com/vosk/models/$f" -o "$f"
          done
          gh release delete models -y || true
          gh release create models vosk-model-small-*.zip \
            --title "Vosk models (offline)" \
            --notes "离线语音模型，App 内可经 ghproxy 镜像下载（国内可达）" \
            --prerelease
