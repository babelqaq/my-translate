name: Build Debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter (latest stable, Dart 3)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Doctor
        run: flutter doctor -v || true

      - name: Generate platform scaffolding (gradle-wrapper.jar etc.)
        # android/ 文本文件已入库，但 gradle-wrapper.jar 是二进制需生成。
        # flutter create 不会覆盖已存在的自定义文件（asr/*.kt 等）。
        run: flutter create --platforms=android --project-name my_translate .

      - name: Restore committed custom files
        # flutter create 可能覆盖我们的 build.gradle / Manifest / Kotlin，
        # 从 git 恢复我们的版本（不影响 flutter create 生成的 res/ 和 gradle-wrapper.jar）。
        run: |
          git checkout -- android/app/build.gradle \
            android/app/src/main/AndroidManifest.xml \
            android/app/src/main/kotlin/ \
            android/settings.gradle \
            android/build.gradle \
            android/gradle.properties \
            android/gradle/wrapper/gradle-wrapper.properties \
            android/app/proguard-rules.pro

      - name: Download sherpa-onnx AAR (if not committed)
        # 如果 android/app/libs/ 没有 AAR，从 GitHub Releases 下载
        # （CI runner 可访问 GitHub；本地用户需手动下载并提交）
        run: |
          if ! ls android/app/libs/sherpa-onnx-*.aar 1>/dev/null 2>&1; then
            echo "AAR not found, downloading from GitHub Releases..."
            curl -fSL -o android/app/libs/sherpa-onnx-1.12.25.aar \
              "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.25/sherpa-onnx-1.12.25.aar"
          else
            echo "AAR already present, skipping download."
          fi

      - name: Fetch models from ModelScope
        run: bash tools/fetch_models.sh

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug --verbose

      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            android/build/outputs/logs/
            **/flutter_build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-translate-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
