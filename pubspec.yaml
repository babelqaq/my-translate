name: my_translate
description: 语音翻译助手 - 双语实时对话翻译器（中⇄英 / 中⇄俄），Sherpa-ONNX 离线 ASR + 国内大模型翻译
publish_to: 'none'
version: 2.0.0+1

environment:
  # Phase A：移除 vosk_flutter 后解锁 Dart 3 / Flutter 3.22+
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 翻译 API（国内大模型 OpenAI 兼容接口）
  http: ^1.2.0
  # 语音合成（TTS 同声传译朗读）
  flutter_tts: ^4.0.0
  # 状态管理
  provider: ^6.1.2
  # 设置持久化
  shared_preferences: ^2.3.0
  # 权限申请
  permission_handler: ^11.3.0
  # sherpa_onnx 底座走 android/app/libs/ 的官方 AAR，不加 pub 依赖（避免双源）

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Phase A：模型不再经 Flutter assets 打包，改由 android/app/src/main/assets/
  # 原生 AssetManager 直读（sherpa-onnx Kotlin API 支持）。删除旧 assets 段。
