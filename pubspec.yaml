name: my_translate
description: 语音翻译助手 - 听外语(英/俄)出中文字幕，听中文自动外语同声传译（Vosk 离线 / Google 在线，DeepL 免费 Key 翻译）
publish_to: 'none'
version: 1.0.0+1

environment:
  # 锁在 Dart 2.x：vosk_flutter 0.3.48 的约束是 sdk: ">=2.15.1 <3.0.0"，
  # 因此整个工程必须用 Flutter 3.7.x（Dart 2.19）构建，不能用 3.10+（Dart 3）。
  sdk: '>=2.17.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 离线语音识别（Vosk，双模型并行自动检测语种）
  vosk_flutter: ^0.3.48
  # 麦克风采集（把同一路 PCM 同时喂给两个 Vosk 识别器）
  # 9.2.13 是兼容 Dart 2.19 的最高 9.x 版本（9.3.0+ 起要求 Dart 3.3）
  flutter_sound: 9.2.13
  # Google 在线语音识别（可选引擎，更高准确率）
  # 6.1.1 是兼容 Dart 2.19 的最高版本（6.2.0+ 起要求 Dart 3.0）
  speech_to_text: 6.1.1
  # 翻译 API（DeepL 免费版，需免费 Key）
  # 0.13.x 兼容 Dart 2.x（1.x 部分版本要求 Dart 3）
  http: ^0.13.5
  # 语音合成（TTS 同传朗读）
  # 3.8.5 兼容 Dart 2.19（4.x 要求 Dart 3.4）
  flutter_tts: 3.8.5
  # 状态管理
  provider: ^6.1.2
  # 设置持久化
  shared_preferences: ^2.2.2
  # 权限申请（10.2.0 兼容 Dart 2.x）
  permission_handler: 10.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
