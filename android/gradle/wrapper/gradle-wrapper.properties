# android/gradle/wrapper/gradle-wrapper.properties
# CI 中 `flutter create` 可能生成较低的 Gradle 版本；build-apk.yml 的
# "Pin Gradle to 9.1.0" 步骤会用 sed 强制对齐到 9.1.0
# （当前 Flutter stable 实际应用的 AGP 要求 Gradle >= 9.1.0）。
# 此处也直接写 9.1.0，保证本地与 CI 一致，避免
# "Minimum supported Gradle version is 9.1.0" 报错。
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.1.0-bin.zip
