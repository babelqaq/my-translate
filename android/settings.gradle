// android/settings.gradle
// Flutter 新 DSL 平台工程配置（Groovy DSL，扩展名为 .gradle）。
// AGP / Kotlin 版本由 dev.flutter.flutter-gradle-plugin（来自 Flutter SDK 的 includeBuild）驱动，
// 不再在此处钉死版本，避免与 AGP 9+ 冲突。

pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        if (flutterSdkPath == null) {
            throw new GradleException("flutter.sdk not set in local.properties")
        }
        return flutterSdkPath
    }()
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
    }
}

include ":app"
