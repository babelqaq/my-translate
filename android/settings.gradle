// android/settings.gradle
// Flutter 新 DSL 平台工程配置（Groovy DSL，扩展名为 .gradle）。
// AGP / Kotlin 版本由 dev.flutter.flutter-gradle-plugin（来自 Flutter SDK 的 includeBuild）驱动，
// 不再在此处钉死版本，避免与 AGP 9+ 冲突。

pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        if (flutterSdkPath == null) {
            throw new GradleException("flutter.sdk not set in local.properties")
        }
        return flutterSdkPath
    }()
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // AGP / Kotlin 版本必须与当前 Flutter stable 自带版本一致（gradle_utils: 9.0.1 / 2.3.20），
    // 否则 app/build.gradle 的 plugins { id "com.android.application" } 因缺版本号而无法解析。
    // 这两个 apply false 声明也正好对齐 dev.flutter.flutter-gradle-plugin 内部使用的 AGP 9，不会触发 AGP 9 DSL 报错。
    id "com.android.application" version "9.0.1" apply false
    id "org.jetbrains.kotlin.android" version "2.3.20" apply false
}

include ":app"
